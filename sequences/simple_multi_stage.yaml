name: Multi-Stage Test
description: Test at multiple vacuum levels with setpoint control
created_date: '2024-11-14T00:00:00'
modified_date: '2024-11-14T00:00:00'
author: System
stages:
  - name: Low Vacuum Test
    target_vacuum_bar: 0.3
    max_time_seconds: 60.0
    min_time_seconds: 5.0
    pump_mode: maintain
    vacuum_tolerance_bar: 0.05
    collect_data: true
    io_actions:
      - device_name: vacuum_valve
        action_type: digital_output
        value: true
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vacuum valve to connect pump to chamber
      
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Close vent valve during evacuation
      
      - device_name: vent_valve
        action_type: digital_output
        value: true
        timing: end_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vent valve to release vacuum
  
  - name: Medium Vacuum Test
    target_vacuum_bar: 0.5
    max_time_seconds: 60.0
    min_time_seconds: 10.0
    pump_mode: maintain
    vacuum_tolerance_bar: 0.05
    collect_data: true
    io_actions:
      - device_name: vacuum_valve
        action_type: digital_output
        value: true
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vacuum valve to connect pump to chamber
      
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Close vent valve during evacuation
      
      - device_name: vent_valve
        action_type: digital_output
        value: true
        timing: end_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vent valve to release vacuum
  
  - name: High Vacuum Test
    target_vacuum_bar: 0.7
    max_time_seconds: 90.0
    min_time_seconds: 15.0
    pump_mode: maintain
    vacuum_tolerance_bar: 0.05
    collect_data: true
    io_actions:
      - device_name: vacuum_valve
        action_type: digital_output
        value: true
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vacuum valve to connect pump to chamber
      
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Close vent valve during evacuation
      
      - device_name: vent_valve
        action_type: digital_output
        value: true
        timing: end_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vent valve to release vacuum
