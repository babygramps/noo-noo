name: Setpoint-Only Test
description: Demonstrates setpoint-based completion without time limits
created_date: '2024-11-14T00:00:00'
modified_date: '2024-11-14T00:00:00'
author: System
stages:
  - name: Reach Low Vacuum
    target_vacuum_bar: 0.3
    max_time_seconds: null
    min_time_seconds: 0.0
    pump_mode: continuous
    vacuum_tolerance_bar: 0.05
    collect_data: true
    io_actions:
      - device_name: inlet_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set inlet_valve to CLOSED at start of stage
      
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set vent_valve to CLOSED at start of stage
  
  - name: Reach High Vacuum
    target_vacuum_bar: 0.8
    max_time_seconds: null
    min_time_seconds: 5.0
    pump_mode: continuous
    vacuum_tolerance_bar: 0.05
    collect_data: true
    io_actions:
      - device_name: vent_valve
        action_type: digital_output
        value: true
        timing: end_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set vent_valve to OPEN at end of stage

