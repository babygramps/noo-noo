name: Example IO Control Panel
description: This example shows how all I/O devices are visible and configurable for each stage
mode: advanced
created_date: '2024-11-14T13:00:00'
modified_date: '2024-11-14T13:00:00'
author: System
loop_count: 1
pause_between_stages: false
stages:
  - name: Stage 1 - Seal Chamber
    target_vacuum_bar: 0.4
    hold_time_seconds: 20.0
    ramp_rate_bar_per_sec: 0.1
    sample_rate_hz: 10.0
    delay_before_seconds: 0.0
    max_force_kg: null
    max_single_cell_kg: null
    collect_data: true
    auto_vent: false
    io_actions:
      # All I/O states are visible in the editor:
      # inlet_valve: CLOSED at start, CLOSED at end
      # vent_valve: CLOSED at start, CLOSED at end
      # safety_valve: CLOSED at start, CLOSED at end
      
      - device_name: inlet_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set inlet_valve to CLOSED at start of stage
      
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set vent_valve to CLOSED at start of stage
      
      - device_name: safety_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set safety_valve to CLOSED at start of stage
  
  - name: Stage 2 - Release Vacuum
    target_vacuum_bar: 0.6
    hold_time_seconds: 30.0
    ramp_rate_bar_per_sec: 0.1
    sample_rate_hz: 10.0
    delay_before_seconds: 2.0
    max_force_kg: null
    max_single_cell_kg: null
    collect_data: true
    auto_vent: true
    io_actions:
      # inlet_valve: CLOSED at start, CLOSED at end
      # vent_valve: CLOSED at start, OPEN at end (to release vacuum)
      # safety_valve: CLOSED throughout
      
      - device_name: inlet_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set inlet_valve to CLOSED at start of stage
      
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set vent_valve to CLOSED at start of stage
      
      - device_name: vent_valve
        action_type: digital_output
        value: true
        timing: end_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set vent_valve to OPEN at end of stage
      
      - device_name: safety_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set safety_valve to CLOSED at start of stage

