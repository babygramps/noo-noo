name: Example with Auto-Generated I/O
description: This sequence was created in Advanced mode and shows the auto-generated I/O states for proper vacuum operation
mode: advanced
created_date: '2024-11-14T12:00:00'
modified_date: '2024-11-14T12:00:00'
author: System
loop_count: 1
pause_between_stages: false
stages:
  - name: Test Stage with Auto I/O
    target_vacuum_bar: 0.5
    hold_time_seconds: 30.0
    ramp_rate_bar_per_sec: 0.1
    sample_rate_hz: 10.0
    delay_before_seconds: 0.0
    max_force_kg: null
    max_single_cell_kg: null
    collect_data: true
    auto_vent: true
    io_actions:
      # These I/O states were auto-generated when the stage was created in Advanced mode
      # All devices are visible in the I/O control panel with dropdown menus
      
      # inlet_valve: CLOSED at start (seals chamber)
      - device_name: inlet_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set inlet_valve to CLOSED at start of stage
      
      # vent_valve: CLOSED at start (enables vacuum), OPEN at end (releases pressure)
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set vent_valve to CLOSED at start of stage
      
      - device_name: vent_valve
        action_type: digital_output
        value: true
        timing: end_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set vent_valve to OPEN at end of stage
      
      # safety_valve: CLOSED throughout
      - device_name: safety_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Set safety_valve to CLOSED at start of stage

