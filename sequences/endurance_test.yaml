name: Endurance Test
description: Extended duration test with time-based completion
created_date: '2024-11-14T00:00:00'
modified_date: '2024-11-14T00:00:00'
author: System
stages:
  - name: Ramp to Test Vacuum
    target_vacuum_bar: 0.6
    max_time_seconds: 120.0
    min_time_seconds: 0.0
    pump_mode: continuous
    vacuum_tolerance_bar: 0.05
    collect_data: true
    io_actions:
      - device_name: vacuum_valve
        action_type: digital_output
        value: true
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vacuum valve to connect pump to chamber
      
      - device_name: vent_valve
        action_type: digital_output
        value: false
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Close vent valve during evacuation
  
  - name: Long Duration Hold
    target_vacuum_bar: null
    max_time_seconds: 300.0
    min_time_seconds: 0.0
    pump_mode: maintain
    vacuum_tolerance_bar: 0.03
    collect_data: true
    io_actions:
      - device_name: vacuum_valve
        action_type: digital_output
        value: true
        timing: start_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Keep vacuum valve open for pump cycling
      
      - device_name: vent_valve
        action_type: digital_output
        value: true
        timing: end_of_stage
        delay_seconds: 0.0
        duration_seconds: null
        description: Open vent valve to release vacuum
