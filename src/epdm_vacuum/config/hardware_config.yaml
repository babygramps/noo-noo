# EPDM Vacuum Fixture - Hardware Configuration
# Version: 1.1.0

# Hardware Interfaces
hardware:
  widgetlords:
    enabled: true
    pressure_channel: 0  # Analog input channel for pressure sensor (legacy)
    pump_relay: 0  # Relay channel for vacuum pump control (legacy)
    
    # SPI Module Configuration
    # Each module is assigned to a Chip Enable (CE0-CE4) line
    # PI-SPI-DIN-4KO supports stacking up to 4 modules per CE using addresses 0-3
    spi_modules:
      - name: relay_module
        module_type: PI-SPI-DIN-4KO
        chip_enable: CE0
        address: 0
        channels:
          - channel: 0
            name: vacuum_pump
            enabled: true
            description: Main vacuum pump relay
          - channel: 1
            name: vacuum_valve
            enabled: true
            description: Vacuum line isolation valve
          - channel: 2
            name: vent_valve
            enabled: true
            description: Chamber vent valve
          - channel: 3
            name: spare_relay
            enabled: false
            description: Spare relay output
      
      - name: analog_inputs
        module_type: PI-SPI-DIN-8AI
        chip_enable: CE1
        address: 0
        channels:
          - channel: 0
            name: pressure_sensor
            enabled: true
            input_type: 4-20mA    # Input signal type: 4-20mA, 0-10V, or 0-5V
            low_input: 4.0        # Low span input value (mA)
            low_output: -14.7     # Low span = full vacuum (-14.7 PSIG)
            high_input: 20.0      # High span input value (mA)
            high_output: 30.0     # High span = +30 PSIG
            units: PSIG           # Gauge pressure
            description: Chamber pressure sensor (vacuum to 30 PSIG)
          - channel: 1
            name: analog_spare_1
            enabled: false
            input_type: 4-20mA
            low_input: 4.0
            low_output: 0.0
            high_input: 20.0
            high_output: 100.0
            units: ""
            description: Spare analog input
          - channel: 2
            name: analog_spare_2
            enabled: false
            input_type: 4-20mA
            low_input: 4.0
            low_output: 0.0
            high_input: 20.0
            high_output: 100.0
            units: ""
            description: Spare analog input
          - channel: 3
            name: analog_spare_3
            enabled: false
            input_type: 4-20mA
            low_input: 4.0
            low_output: 0.0
            high_input: 20.0
            high_output: 100.0
            units: ""
            description: Spare analog input
          - channel: 4
            name: analog_spare_4
            enabled: false
            input_type: 4-20mA
            low_input: 4.0
            low_output: 0.0
            high_input: 20.0
            high_output: 100.0
            units: ""
            description: Spare analog input
          - channel: 5
            name: analog_spare_5
            enabled: false
            input_type: 4-20mA
            low_input: 4.0
            low_output: 0.0
            high_input: 20.0
            high_output: 100.0
            units: ""
            description: Spare analog input
          - channel: 6
            name: analog_spare_6
            enabled: false
            input_type: 4-20mA
            low_input: 4.0
            low_output: 0.0
            high_input: 20.0
            high_output: 100.0
            units: ""
            description: Spare analog input
          - channel: 7
            name: analog_spare_7
            enabled: false
            input_type: 4-20mA
            low_input: 4.0
            low_output: 0.0
            high_input: 20.0
            high_output: 100.0
            units: ""
            description: Spare analog input
  
  modbus:
    enabled: true
    port: /dev/ttyUSB0  # Serial port for Modbus RTU (Windows: COM4)
    baudrate: 9600  # Communication speed (TLB4 configured for 9600)
    slave_address: 1  # Modbus device address (TLB4 Addr setting)
    timeout: 1.0  # Communication timeout in seconds
    parity: None  # Parity: None, Even, Odd, Mark, Space (TLB4: nOnE)
    databits: 8  # Data bits per byte (7 or 8)
    stopbits: 1  # Stop bits (1, 1.5, or 2) (TLB4: StOP: 1)
    byteorder: big  # Byte order: big or little (TLB4 uses Big-Endian)
    wordorder: big  # Word order for 32-bit values: big or little
    close_port_after_each_call: false  # Close port after each read
    debug: false  # Enable debug logging for troubleshooting
    
    # TLB4 4-Channel Load Cell Transmitter Configuration
    # 
    # IMPORTANT: Command 25 must be sent to enable individual channel mode!
    # The software does this automatically on connection.
    #
    # MODBUS REGISTER MAPPING (TLB4 uses 40001-based addressing):
    #   In code, we use 0-based addresses: address = register_number - 40001
    #   
    #   40006 (addr 5):           COMMAND REGISTER (write commands here)
    #   40008-40009 (addr 7-8):   GROSS WEIGHT H/L (32-bit combined)
    #   40010-40011 (addr 9-10):  NET WEIGHT H/L (32-bit)
    #   40012-40013 (addr 11-12): PEAK WEIGHT H/L (32-bit)
    #   40050 (addr 49):          INSTRUMENT STATUS
    #
    # AFTER COMMAND 25 (4x HiRes Channel Mode):
    #   40051-40052 (addr 50-51): Channel 1 - 32-bit signed raw divisions
    #   40053-40054 (addr 52-53): Channel 2 - 32-bit signed raw divisions
    #   40055-40056 (addr 54-55): Channel 3 - 32-bit signed raw divisions
    #   40057-40058 (addr 56-57): Channel 4 - 32-bit signed raw divisions
    #
    tlb4:
      # Register addresses (0-based, subtract 40001 from TLB4 register number)
      registers:
        gross_weight: 7      # 40008 - Total gross weight H (32-bit with next reg)
        net_weight: 9        # 40010 - Net weight H (32-bit with next reg)
        tare_weight: 11      # 40012 - Tare/Peak weight H
        status: 6            # 40007 - Status register (16-bit)
        command: 5           # 40006 - Command register (write 25 to enable channels)
        # Individual channel registers (32-bit each, enabled by Command 25)
        channel_1: 50        # 40051-40052 - Channel 1 raw divisions (32-bit)
        channel_2: 52        # 40053-40054 - Channel 2 raw divisions (32-bit)
        channel_3: 54        # 40055-40056 - Channel 3 raw divisions (32-bit)
        channel_4: 56        # 40057-40058 - Channel 4 raw divisions (32-bit)
      
      # Data format for channel values
      # After Command 25, channels are 32-bit signed integers (raw divisions)
      data_format: int32     # int32 for HiRes channel data
      decimal_places: 0      # Raw divisions have no decimal places
      
      # =========================================================================
      # LOAD CELL SCALING (Factory calibrated 0-20kg load cells, 1.5mV/V)
      # =========================================================================
      # 
      # Formula: kg = raw_value / kg_per_division
      # 
      # The kg_per_division value depends on TLB4 configuration. To find it:
      #   1. Put a known weight on one load cell
      #   2. Check the raw value in the terminal logs
      #   3. Calculate: kg_per_division = raw_value / known_weight_kg
      #
      # Example: If 10kg shows raw=50000, then kg_per_division = 50000/10 = 5000
      #
      # All 4 load cells are identical, so they share the same scaling.
      # Software taring is available via the GUI (tare offsets stored separately).
      #
      channel_scaling:
        # Divisions per kg - Calibrated from 500g test weight
        # 36024 raw divisions / 0.5 kg = 72048
        kg_per_division: 72000.0
        
        # Per-channel enable/disable
        channel_1:
          enabled: true
        channel_2:
          enabled: true
        channel_3:
          enabled: true
        channel_4:
          enabled: true

# Pressure Sensor Configuration (SPT25-20-V30D)
pressure_sensor:
  voltage_min: 0.0  # Volts
  voltage_max: 10.0  # Volts
  pressure_min_psi: 0.0  # PSI at voltage_min
  pressure_max_psi: 30.0  # PSI at voltage_max
  calibration_offset: 0.0  # Voltage offset correction
  calibration_scale: 1.0  # Voltage scale factor

# Safety Limits
safety:
  max_vacuum_bar: 1.0  # Maximum vacuum pressure (bar)
  max_force_kg: 800.0  # Maximum total force (kg)
  max_single_cell_kg: 250.0  # Maximum single load cell force (kg)
  emergency_stop_enabled: true
  alarm_threshold_violations: 3  # Number of violations before alarm

# Test Configuration
test:
  default_target_vacuum_bar: 0.5  # Default target vacuum (bar)
  default_hold_time_seconds: 30  # Default hold time (seconds)
  default_ramp_rate_bar_per_sec: 0.1  # Default vacuum ramp rate
  sample_rate_hz: 10.0  # Data acquisition sample rate (Hz)
  max_test_duration_seconds: 600  # Maximum test duration (10 minutes)

# Data Logging
logging:
  output_dir: data  # Directory for output files
  log_level: INFO  # Logging level (DEBUG, INFO, WARNING, ERROR)
  buffer_size: 10000  # Maximum data points in memory buffer
  auto_save_enabled: true  # Automatically save data after test
  save_format: csv  # Default save format (csv, hdf5, both)

# API Configuration
api:
  enabled: false  # Enable Flask API server
  host: 0.0.0.0  # Listen on all interfaces
  port: 8000  # API port
  debug: false  # Flask debug mode
  cors_enabled: true  # Enable CORS for browser access

# GUI Configuration
gui:
  window_width: 1280
  window_height: 720
  plot_update_interval_ms: 100  # Plot update interval (milliseconds)
  display_update_interval_ms: 100  # Display update interval

# Sequence Configuration
sequences:
  directory: sequences  # Directory for sequence files
  auto_load_last: false  # Automatically load the last used sequence on startup
  max_stages_per_sequence: 50  # Maximum number of stages allowed
  validate_on_load: true  # Validate sequences when loading

# I/O Device Configuration
io_devices:
  # Define available I/O devices for sequencing
  # Based on actual hardware: vent valve, vacuum valve, vacuum pump relay
  #
  # device_role field identifies the function of each device for auto-defaults:
  #   - vacuum_pump: The main vacuum pump (controlled automatically by pump mode)
  #   - vacuum_valve: Valve between pump and chamber (opens to draw vacuum)
  #   - vent_valve: Valve to atmosphere (opens to release vacuum)
  #   - generic: Other devices (no special handling in sequences)
  #
  digital_outputs:
    - name: vacuum_pump
      channel: 0
      device_role: vacuum_pump
      description: Main vacuum pump relay (controlled automatically by pump mode)
      default_state: false
    
    - name: vacuum_valve
      channel: 1
      device_role: vacuum_valve
      description: Vacuum valve - between pump and chamber
      default_state: false
    
    - name: vent_valve
      channel: 2
      device_role: vent_valve
      description: Vent valve - releases chamber to atmosphere
      default_state: false

# Calibration Files
calibration:
  pressure_sensor_file: calibration/pressure_sensor.json
  load_cells_file: calibration/load_cells.json

